[package]
name = "dsh-desktop-supervisor"
version = "0.1.0-dev.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-dialog = "2.7.2"
