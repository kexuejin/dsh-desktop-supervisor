name: Desktop Supervisor Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to attach assets to.
        required: true
        type: string
      draft:
        description: Create or update the release as a draft.
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'dsh-desktop-supervisor-v*'

permissions:
  contents: write

concurrency:
  group: desktop-supervisor-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  APP_DIR: app
  RELEASE_DIR: dist/desktop-supervisor
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == true }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-15
            platform: darwin
            arch: arm64
          - label: linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
          - label: windows-x64
            os: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop supervisor
        if: matrix.platform != 'win32'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir ${{ env.APP_DIR }} run build

      - name: Build Windows NSIS installer
        if: matrix.platform == 'win32'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir ${{ env.APP_DIR }} exec tauri build --bundles nsis

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p "${{ env.RELEASE_DIR }}"
          find "${{ env.APP_DIR }}/src-tauri/target/release/bundle" -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.deb' -o -name '*.deb.tar.gz' -o -name '*.rpm' -o -name '*.rpm.tar.gz' -o -name '*.msi' -o -name '*.exe' -o -name '*.sig' \) -print -exec cp {} "${{ env.RELEASE_DIR }}/" \;
          cd "${{ env.RELEASE_DIR }}"
          for file in *; do
            [ -f "$file" ] || continue
            safe=${file// /.}
            mv "$file" "dsh-desktop-supervisor-${{ matrix.platform }}-${{ matrix.arch }}-$safe"
          done
        if: matrix.platform != 'win32'

      - name: Collect Windows release assets
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:RELEASE_DIR | Out-Null
          $releaseRoot = "$env:APP_DIR/src-tauri/target/release"
          Get-ChildItem $releaseRoot -File -Filter 'dsh-desktop-supervisor.exe' |
            ForEach-Object {
              $safeName = $_.Name.Replace(' ', '.')
              Copy-Item $_.FullName (Join-Path $env:RELEASE_DIR "dsh-desktop-supervisor-${{ matrix.platform }}-${{ matrix.arch }}-$safeName")
            }
          $bundleRoot = Join-Path $releaseRoot 'bundle'
          if (Test-Path $bundleRoot) {
            Get-ChildItem $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.msi', '.exe', '.zip', '.sig' } |
              ForEach-Object {
                $safeName = $_.Name.Replace(' ', '.')
                Copy-Item $_.FullName (Join-Path $env:RELEASE_DIR "dsh-desktop-supervisor-${{ matrix.platform }}-${{ matrix.arch }}-$safeName")
              }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-supervisor-${{ matrix.label }}
          path: ${{ env.RELEASE_DIR }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-supervisor-*
          path: dist/desktop-supervisor/assets
          merge-multiple: true

      - name: Generate manifest and checksums
        run: |
          mkdir -p dist/desktop-supervisor/release
          cd dist/desktop-supervisor/assets
          sha256sum * > ../release/SHA256SUMS
          node "$GITHUB_WORKSPACE/scripts/desktop-supervisor-manifest.mjs" \
            --tag "$RELEASE_TAG" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG" \
            --assets-dir . \
            --checksums ../release/SHA256SUMS \
            --out ../release/manifest.json
          node "$GITHUB_WORKSPACE/scripts/desktop-supervisor-updater-manifest.mjs" \
            --tag "$RELEASE_TAG" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG" \
            --assets-dir . \
            --out ../release/latest.json
          cp * ../release/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/desktop-supervisor/release/* --clobber
            gh release edit "$tag" --title "$tag" --target "$GITHUB_SHA" --draft="$RELEASE_DRAFT" --verify-tag
          else
            args=("$tag" dist/desktop-supervisor/release/* --title "$tag" --target "$GITHUB_SHA" --verify-tag)
            if [ "$RELEASE_DRAFT" = 'true' ]; then args+=(--draft); fi
            gh release create "${args[@]}"
          fi
